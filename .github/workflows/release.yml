# CD: when a release is published (e.g. v1.0.0), build the Docker image and publish it to
# GitHub Container Registry, so anyone can run Clearance without building it themselves:
#   docker pull ghcr.io/wajidshaik10/clearance-privacy-rag:latest
# The image never contains secrets: vault keys and the OpenAI key are supplied at run time (.env).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # needed to publish to ghcr.io

jobs:
  image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub's built-in token for this run; no personal secret

      - name: Work out image names and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/clearance-privacy-rag
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
