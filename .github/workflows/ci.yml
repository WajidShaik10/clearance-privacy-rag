# CI: on every push and pull request, run all tests on a clean machine and check the Docker image builds.
# No secrets are used: the one live OpenAI test skips itself without a key; everything else uses a stand-in AI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read

concurrency: # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip # reuse downloaded packages (including the ~400 MB spaCy model) between runs
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Tesseract (OCR for scanned pages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python packages and the spaCy name model
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m spacy download en_core_web_lg

      - name: Cache the embedding model (MiniLM)
        uses: actions/cache@v6
        with:
          path: ~/.cache/chroma
          key: chroma-minilm-${{ runner.os }}-v1

      - name: Run all tests
        run: python -m pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (not published)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
